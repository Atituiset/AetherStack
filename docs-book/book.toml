[book]
title = "AetherStack 技术文档"
authors = ["AetherStack Team"]
language = "zh-CN"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
git-repository-url = "https://github.com/Atituiset/AetherStack"
edit-url-template = "https://github.com/Atituiset/AetherStack/edit/master/docs-book/{path}"

[output.html.search]
enable = true
