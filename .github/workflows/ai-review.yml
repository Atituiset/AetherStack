# AI Review Gate — 目标仓 caller 模板
# 安装：复制本文件到目标仓 .github/workflows/ai-review.yml（详见 docs/ci-setup.md）
# 评审逻辑全部在 Atituiset/agent-reviewer 的可复用 workflow 中，此处仅为引用。

name: ai-review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  security-events: write
  id-token: write   # claude-code-action 需要 OIDC 换取 GitHub token
  pull-requests: write   # 评审结论评论回 PR

jobs:
  review:
    uses: Atituiset/agent-reviewer/.github/workflows/ai-review-reusable.yml@mvp
    secrets: inherit
