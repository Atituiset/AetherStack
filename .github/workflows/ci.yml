name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure & build (C++17)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Unit tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Event catalog consistency (events.h <-> events.ts)
        run: python3 tools/scripts/check_events_sync.py

  lmt-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lmt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
